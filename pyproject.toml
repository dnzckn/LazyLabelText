[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lazylabeltext"
version = "0.1.36"
description = "A desktop tool for zero-shot chunk classification with LLMs, with built-in multi-strategy chunking."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Deniz N. Cakan", email = "deniz.n.cakan@gmail.com" }]
keywords = ["labeling", "text", "corpus", "nlp", "annotation", "chunking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "PyQt6>=6.7.1,<6.10",
    "pyqtdarktheme==2.1.0",
    "numpy>=2.1.2",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "markdown>=3.6",
    "beautifulsoup4>=4.12.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
include-ai = [
    "anthropic>=0.39.0",
    "openai>=1.40.0",
    "google-genai>=1.0.0",
    "langchain-openai>=0.2.0",
    "httpx[http2]>=0.27.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.7.1",
    "pyarrow>=14.0.0",
]
azure = ["langchain-openai>=0.2.0", "httpx[http2]>=0.27.0"]
parquet = ["pyarrow>=14.0.0"]
anthropic = ["anthropic>=0.39.0"]
openai = ["openai>=1.40.0"]
google = ["google-genai>=1.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.8.0",
]

[project.scripts]
llt = "lazylabeltext.main:main"
lazylabeltext = "lazylabeltext.main:main"

[project.urls]
Homepage = "https://github.com/dnzckn/LazyLabelText"
Repository = "https://github.com/dnzckn/LazyLabelText"
Issues = "https://github.com/dnzckn/LazyLabelText/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--tb=short"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["lazylabeltext"]
